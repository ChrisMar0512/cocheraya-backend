# ============================================================
# CocheraYa — Configuración de la Aplicación (Desarrollo Local)
# ============================================================

server.port=8080

# --- Base de Datos Local con PostGIS ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cocheraya_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cocheraya_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cocheraya_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (Clave secreta segura de 256 bits para desarrollo y producción) ---
app.jwt.secret=${APP_JWT_SECRET:c2VjdXJlX2tleV9mb3JfY29jaGVyYXlhX2JhY2tlbmRfcHJvamVjdF8yMDI2X2RlcGxveW1lbnRfc2VjcmV0XzI1Ng==}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# --- Firebase Cloud Messaging (opcional en local) ---
firebase.credentials.path=classpath:firebase-service-account.json

# --- Logging Estructurado (SLF4J + Logback) ---
logging.level.com.cocheraya=INFO
logging.level.org.springframework.security=WARN

# --- Cloudinary ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- Email (SMTP - Gmail App Password o Mock) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:cocheraya.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://cocheraya.vercel.app}

# --- Multipart File Upload Limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB